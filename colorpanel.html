<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:sans-serif}
.panel{-webkit-app-region:drag;cursor:move;position:relative;box-sizing:border-box;width:200px;height:160px;padding:10px;border-radius:16px;background:rgba(24,28,36,.94);border:1px solid rgba(255,255,255,.16)}
.cp-close{-webkit-app-region:no-drag;position:absolute;top:6px;right:8px;width:20px;height:20px;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:transparent;color:#fff;font-size:11px;cursor:pointer}
.sv{-webkit-app-region:no-drag;position:relative;margin-top:22px;height:90px;border-radius:8px;cursor:crosshair;touch-action:none}
.hue{-webkit-app-region:no-drag;position:relative;margin-top:12px;height:14px;border-radius:7px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.dot{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;box-sizing:border-box;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 3px rgba(0,0,0,.6)}
.hue .dot{top:50%}
/* dark-glass-style */
.panel{border-radius:22px;border:1px solid rgba(255,255,255,.16);
background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.02) 40%,rgba(255,255,255,.01) 65%,rgba(255,255,255,.07) 100%),rgba(8,10,16,.78);
box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 2px rgba(255,255,255,.08),inset 0 0 24px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.5)}
.panel::before{content:"";position:absolute;left:6%;right:6%;top:0;height:40%;border-radius:22px 22px 70% 70%/22px 22px 36% 36%;
background:linear-gradient(to bottom,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
.cp-close{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.5)}
.cp-close:hover{background:rgba(255,255,255,.2)}
.sv,.hue{border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.1)}
.dot{width:14px;height:14px;border:1.5px solid rgba(255,255,255,.9);
background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%);
box-shadow:0 2px 6px rgba(0,0,0,.7),inset 0 1px 1px rgba(255,255,255,.8)}</style></head><body>
<div class="panel">
<button class="cp-close" id="x">&#10005;</button>
<div class="sv" id="sv"><div class="dot" id="svd"></div></div>
<div class="hue" id="hue"><div class="dot" id="hd"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sv = $("sv"), hue = $("hue"), svd = $("svd"), hd = $("hd");
let H = 0, S = 1, V = 1;
const clamp = (x) => Math.min(1, Math.max(0, x));
function hsvToHex(h, s, v) {
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0); };
  const to = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
  return "#" + to(f(5)) + to(f(3)) + to(f(1));
}
function hexToHsv(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
function render() {
  sv.style.background = "linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(" + H + ",100%,50%))";
  svd.style.left = (S * 100) + "%"; svd.style.top = ((1 - V) * 100) + "%";
  hd.style.left = (H / 360 * 100) + "%";
}
function commit() { PanelAPI.pick(hsvToHex(H, S, V)); }
function drag(el, fn) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); fn(e);
    const mv = (ev) => fn(ev);
    const up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); };
    el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
  });
}
drag(sv, (e) => { const r = sv.getBoundingClientRect(); S = clamp((e.clientX - r.left) / r.width); V = 1 - clamp((e.clientY - r.top) / r.height); render(); commit(); });
drag(hue, (e) => { const r = hue.getBoundingClientRect(); H = clamp((e.clientX - r.left) / r.width) * 360; render(); commit(); });
$("x").addEventListener("click", () => PanelAPI.close());
const c = new URLSearchParams(location.search).get("c");
if (c && /^#[0-9a-f]{6}$/i.test(c)) [H, S, V] = hexToHsv(c);
render();
</script></body></html>
